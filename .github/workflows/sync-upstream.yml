name: Sync upstream master

on:
  schedule:
    - cron: "29 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync upstream master
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/perfect-panel/ppanel-node.git
          git fetch --no-tags upstream master
          git switch --force-create sync/main FETCH_HEAD
          git push origin sync/main --force
